<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173e35">
  <meta name="description" content="黒板とチョークの心地よさを、いつものブラウザに。PC・スマートフォン・タブレットで滑らかな手書き、文字変換、読み上げができる高機能ノート。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="黒板 | 書く。ひらめく。聴く。">
  <meta property="og:description" content="ペンでも、マウスでも、指でも。ひらめきを自由に残せる、黒板とチョークのノートアプリ。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta property="og:site_name" content="黒板">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:url" content="https://uni-tadayasu.github.io/note/">
  <meta property="og:image" content="https://uni-tadayasu.github.io/note/assets/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="黒板 — 書く。ひらめく。聴く。手書き・文字変換・読み上げ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="黒板 | 書く。ひらめく。聴く。">
  <meta name="twitter:description" content="ペンでも、マウスでも、指でも。黒板とチョークの自由なノート。">
  <meta name="twitter:image" content="https://uni-tadayasu.github.io/note/assets/ogp.png">
  <link rel="canonical" href="https://uni-tadayasu.github.io/note/">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="黒板">
  <meta name="color-scheme" content="dark">
  <title>黒板 | 書く。ひらめく。聴く。</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" id="app">
    <aside class="sidebar" id="sidebar" aria-label="ノートライブラリ">
      <a href="./" class="brand" aria-label="黒板 ホーム"><img src="assets/icon.svg" alt="" width="42" height="42"><span><strong>黒板</strong><small>KOKUBAN</small></span></a>
      <button class="new-note primary" id="newNote"><i data-icon="plus"></i>新しいノート</button>
      <div class="search-field"><i data-icon="search"></i><input id="search" type="search" placeholder="ノートを検索" aria-label="ノートを検索"><kbd>⌘ K</kbd></div>
      <nav class="library-nav" aria-label="ノートの表示">
        <button class="nav-item active" data-filter="all"><i data-icon="notebook"></i><span>すべてのノート</span><b id="allCount">0</b></button>
        <button class="nav-item" data-filter="starred"><i data-icon="star"></i><span>お気に入り</span><b id="starCount">0</b></button>
        <button class="nav-item" data-filter="trash"><i data-icon="trash"></i><span>ゴミ箱</span><b id="trashCount">0</b></button>
      </nav>
      <div class="section-caption"><span>ノートブック</span><button class="icon-button small" id="addFolder" aria-label="ノートブックを追加"><i data-icon="plus"></i></button></div>
      <div class="folder-list" id="folders"></div>
      <div class="section-caption notes-caption"><span id="listCaption">最近のノート</span><span id="listCount"></span></div>
      <div class="note-list" id="noteList" aria-label="ノート一覧"></div>
      <div class="sidebar-bottom"><div class="local-status"><i data-icon="shield"></i><span>あなたの端末に、自動保存</span></div><button class="settings-link" id="settingsBtn"><i data-icon="settings"></i><span>設定とバックアップ</span><kbd>?</kbd></button><div class="copyright">© KASAI SOLUTIONS INC.</div></div>
    </aside>
    <button class="sidebar-scrim" id="sidebarScrim" aria-label="ノート一覧を閉じる" hidden></button>
    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><button class="icon-button menu-button" id="menuBtn" aria-label="ノート一覧を開く"><i data-icon="menu"></i></button><i data-icon="notebook" class="desktop-icon"></i><span class="breadcrumb-root">マイノート</span><span class="breadcrumb-slash">/</span><span id="breadcrumbFolder">アイデア</span></div>
        <div class="top-actions"><span class="save-indicator" id="saveStatus" role="status"><i data-icon="check"></i><span>保存済み</span></span><button class="icon-button" id="helpBtn" aria-label="使い方"><i data-icon="help"></i></button><button class="button subtle export-button" id="exportBtn"><i data-icon="export"></i><span>書き出す</span></button><button class="icon-button" id="moreBtn" aria-label="ノートのその他の操作"><i data-icon="more"></i></button></div>
      </header>
      <section class="note-heading">
        <div class="note-heading-text"><div class="note-eyebrow"><span class="folder-dot"></span><span id="noteCategory">IDEA NOTE</span><span class="heading-date" id="noteDate"></span></div><div class="title-line"><input id="noteTitle" aria-label="ノートのタイトル" value="わたしのアイデア帳" maxlength="120"><button class="icon-button favorite-button" id="favoriteBtn" aria-label="お気に入りに追加" aria-pressed="false"><i data-icon="star"></i></button></div></div>
        <div class="feature-actions"><button class="button convert-button" id="recognizeBtn"><i data-icon="sparkles"></i><span>文字に変換</span></button><button class="button read-button" id="readPanelBtn" aria-expanded="false"><i data-icon="volume"></i><span>読み上げ</span></button></div>
      </section>
      <section class="toolbar" aria-label="筆記ツール">
        <div class="tool-group history-tools"><button class="tool-button" id="undoBtn" title="元に戻す (Ctrl / ⌘ Z)" aria-label="手書きを元に戻す"><i data-icon="undo"></i></button><button class="tool-button" id="redoBtn" title="やり直す (Ctrl / ⌘ Shift Z)" aria-label="手書きをやり直す"><i data-icon="redo"></i></button></div>
        <div class="toolbar-divider"></div>
        <div class="tool-group drawing-tools" role="toolbar" aria-label="描く道具">
          <button class="tool-button active" data-tool="pen" aria-label="チョーク" aria-pressed="true" title="チョーク (P)"><i data-icon="pen"></i><span>チョーク</span></button>
          <button class="tool-button" data-tool="marker" aria-label="蛍光チョーク" aria-pressed="false" title="蛍光チョーク (M)"><i data-icon="marker"></i></button>
          <button class="tool-button" data-tool="eraser" aria-label="消しゴム" aria-pressed="false" title="消しゴム (E)"><i data-icon="eraser"></i></button>
          <button class="tool-button" data-tool="text" aria-label="テキスト" aria-pressed="false" title="テキストを配置 (T)"><i data-icon="text"></i></button>
          <button class="tool-button" id="shapeBtn" aria-label="図形" title="直線・四角・丸"><i data-icon="shapes"></i></button>
          <button class="tool-button" data-tool="select" aria-label="範囲選択" aria-pressed="false" title="範囲選択・移動 (V)"><i data-icon="select"></i></button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="color-group" id="colors" aria-label="チョークの色"></div>
        <div class="toolbar-divider responsive-divider"></div>
        <button class="size-button" id="sizeBtn" aria-label="線の太さを調整"><span class="size-dot"></span><span id="sizeLabel">3</span><i data-icon="chevron"></i></button>
        <div class="toolbar-spacer"></div><button class="tool-button" id="pageSettingsBtn" aria-label="黒板の設定" title="黒板の設定"><i data-icon="sliders"></i></button><button class="tool-button" id="focusBtn" aria-label="集中モード" title="集中モード (F)"><i data-icon="expand"></i></button>
      </section>
      <div class="work-area">
        <section class="canvas-zone" id="canvasZone" aria-label="黒板の筆記面">
          <div class="board-stage" id="boardStage"><div class="board-frame" id="boardFrame"><div class="board" id="board"><div class="page-design" id="pageDesign" aria-hidden="true"></div><div class="text-layer" id="textLayer"></div><canvas id="inkCanvas" width="1400" height="900" aria-label="手書きキャンバス。チョークを選んでペン、マウス、指で書けます。"></canvas><div class="board-watermark" aria-hidden="true">Make room for your ideas.</div></div><div class="chalk-rail" aria-hidden="true"><span class="rail-chalk white"></span><span class="rail-chalk yellow"></span><span class="rail-chalk rose"></span><span class="rail-eraser"></span></div></div></div>
          <div class="canvas-bottom"><span class="canvas-tip" id="toolHint"><i data-icon="pen"></i>自由に書いてみましょう</span><div class="view-controls"><button class="icon-button small" id="zoomOut" aria-label="縮小"><i data-icon="minus"></i></button><button id="zoomReset" class="zoom-value" title="画面に合わせる">100%</button><button class="icon-button small" id="zoomIn" aria-label="拡大"><i data-icon="plus"></i></button><span class="mini-divider"></span><button class="icon-button small" id="fitBtn" aria-label="画面に合わせる"><i data-icon="fit"></i></button></div></div>
        </section>
        <aside class="inspector" id="inspector" aria-label="ノートの詳細" hidden><div class="inspector-header"><strong id="panelTitle">読み上げ</strong><button class="icon-button small" id="closePanel" aria-label="パネルを閉じる"><i data-icon="close"></i></button></div><div id="panelContent" class="panel-content"></div></aside>
      </div>
      <footer class="page-footer"><div class="page-navigation"><i data-icon="pages"></i><div id="pageTabs" class="page-tabs" aria-label="ノートのページ"></div><button class="add-page" id="addPage" title="ページを追加" aria-label="ページを追加"><i data-icon="plus"></i></button></div><div class="footer-detail"><span id="pageCount">1 / 1 ページ</span><span class="footer-divider">|</span><span id="strokeCount">0 ストローク</span><button class="icon-button small" id="pageMenu" aria-label="ページ操作"><i data-icon="more"></i></button></div></footer>
    </main>
  </div>
  <div id="popover" class="popover" hidden></div>
  <dialog id="dialog" class="app-dialog"><div class="dialog-heading"><div><span class="dialog-eyebrow" id="dialogEyebrow">KOKUBAN</span><h2 id="dialogTitle"></h2></div><button class="icon-button" id="closeDialog" aria-label="閉じる"><i data-icon="close"></i></button></div><div id="dialogBody"></div></dialog>
  <div id="toasts" class="toast-container" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json,.kokuban" hidden>
  <div id="printRoot"></div>
  <noscript><div class="no-script">黒板を使うには、ブラウザのJavaScriptを有効にしてください。</div></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
