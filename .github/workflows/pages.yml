name: Publish 黒板

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify handwriting, speech, and storage
        run: npm test
      - name: Prepare verified recognition engine and fonts
        run: npm run build
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Finish any existing branch-based publication first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://api.github.com';
          const repository = process.env.GITHUB_REPOSITORY;
          const revision = process.env.GITHUB_SHA;
          const headers = { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28' };
          const get = async path => {
            const response = await fetch(origin + path, { headers, signal: AbortSignal.timeout(20000) });
            if (!response.ok) throw new Error(`GitHub returned ${response.status} while checking publication order`);
            return response.json();
          };
          const pages = await get(`/repos/${repository}/pages`);
          if (pages.build_type === 'workflow') process.exit(0);
          // An existing "Deploy from a branch" setting can publish README after
          // our artifact. Retain that setting and finish its run before ours.
          for (let attempt = 0; attempt < 120; attempt++) {
            const response = await get(`/repos/${repository}/actions/runs?event=dynamic&head_sha=${revision}&per_page=20`);
            const pending = response.workflow_runs.filter(run => run.head_sha === revision && run.name === 'pages build and deployment' && run.status !== 'completed');
            if (!pending.length) { console.log('Existing branch publication has finished; publishing the complete application.'); break; }
            if (attempt === 119) throw new Error('Existing Pages publication did not finish within ten minutes. Re-run this deployment when it completes.');
            console.log('Waiting for the existing Pages publication to finish.');
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          NODE
      - name: Deploy 黒板
        id: deployment
        uses: actions/deploy-pages@v4
